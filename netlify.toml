# Netlify Configuration for NTR & CO LLP

[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    # Block badge.netlify.com script from loading entirely
    Content-Security-Policy = "default-src 'self' https: data: blob: 'unsafe-inline' 'unsafe-eval'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://fonts.googleapis.com https://fonts.gstatic.com https://maps.google.com https://www.googletagmanager.com; frame-src https://maps.google.com https://www.google.com; img-src 'self' data: https:; connect-src 'self' https:; font-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com data:;"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
